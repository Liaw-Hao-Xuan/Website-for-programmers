<html lang="en">
<head>

    gtag('config', 'G-DV0MCQ08GH');

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Code Preview</title>
    <link rel="stylesheet" href="johnathan.css">
    
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <a href="index.html">
                <img src="assets/testimage.png" alt="Logo" width="56" height="41">
            </a>
        </div>

        <div class="navitems">
            <a href="services.html" class="services">Services</a>
            <a href="about.html" class="about">About</a>
            <a href="settings.html" class="settings">Settings</a>
            <a href="help.html" class="help">Help</a>
        </div>

        <div class="search-wrapper">

            <span class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M10 2a8 8 0 105.293 14.293l4.707 4.707 1.414-1.414-4.707-4.707A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4z"/>
                </svg>
            </span>

            <input type="text" placeholder="Search...">

        </div>

    </nav>

    <div class="main-layout">

        <main id="websitePreview">

            <section class="default-preview">
                <h1>Live Website Preview</h1>
                <p>Your code output will appear here.</p>
            </section>

        </main>

    </div>

    <div class="floating-code-container" id="floatingContainer">

        <div class="floating-header" id="dragHeader">

            <div class="editor-tabs">

                <button class="editor-tab active" data-tab="htmlPanel">
                    HTML
                </button>

                <button class="editor-tab" data-tab="cssPanel">
                    CSS
                </button>

                <button class="editor-tab" data-tab="jsPanel">
                    JS
                </button>

            </div>

        </div>


        <div class="editor-scroll-area">

            <div id="htmlPanel" class="floating-code-panel active">

<textarea id="floatingHtml"><section class="monkey">
    <div class="clicker-game">

        <h1>Clicker Game</h1>
    
        <h2>Score: <span id="score">0</span></h2>
    
        <img id="clickImage" src="assets/johnathan.jpeg">
    
    </div></textarea>

            </div>
            <div id="cssPanel" class="floating-code-panel">

<textarea id="floatingCss">body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#1f1f1f;
    color:white;
}

.clicker-game{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px;
}

h1{
    margin-bottom:10px;
}

h2{
    margin-bottom:20px;
}

#clickImage{
    width:250px;
    cursor:pointer;
    user-select:none;
    transition:transform .08s ease;
}

#clickImage:hover{
    transform:scale(1.05);
}

#clickImage:active{
    transform:scale(.92);

    .glow {
        filter: drop-shadow(0 0 10px gold)
                drop-shadow(0 0 25px orange);
        transform: scale(1.05);
    }</textarea>

            </div>
            <div id="jsPanel" class="floating-code-panel">

<textarea id="floatingJs">let score = 0;

    const image = document.getElementById("clickImage");
    const scoreText = document.getElementById("score");
    
    image.onclick = function () {
        score++;
        scoreText.textContent = score;
    
        if (score >= 50) {
            image.classList.add("glow");
        }
    };</textarea>

            </div>

        </div>
        <button class="run-button" id="runFloating">
            Run Code ▶
        </button>

        <div class="resize-handle" id="resizeHandle"></div>

    </div>

    <script src="johnathan.js"></script>
</body>
</html>
